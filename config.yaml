# ORBIT Dataset Configuration
dataset:
  name: "ORBIT"
  root_dir: "data/orbit"
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  
# Image Preprocessing
preprocessing:
  img_size: 640
  normalize: true
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  
# Augmentation Settings
augmentation:
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 10.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.0
  
# Model Architecture
model:
  type: "yolov8n"  # Options: yolov8n, yolov8s, yolov8m, yolov8l, yolov8x
  pretrained: true
  num_classes: 80  # COCO dataset classes (can be adjusted for ORBIT)
  
# Training Hyperparameters
training:
  epochs: 100
  batch_size: 16
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  
# Device Configuration
device:
  gpu: 0
  workers: 4
  
# Inference Settings
inference:
  conf_threshold: 0.5
  iou_threshold: 0.45
  max_det: 100
  img_size: 640
  
# Text-to-Speech Settings
tts:
  engine: "pyttsx3"  # Options: pyttsx3, gTTS
  rate: 150
  volume: 0.9
  voice: 0  # 0 for male, 1 for female
  
# Object Detection Classes to Announce
priority_objects:
  - "person"
  - "car"
  - "bicycle"
  - "chair"
  - "table"
  - "door"
  - "stairs"
  - "obstacle"
  
# Safety Settings
safety:
  min_distance_warning: 2.0  # meters
  warning_interval: 3.0  # seconds
