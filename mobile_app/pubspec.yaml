name: blindstick_app
description: BlindStick Mobile App - Object Detection for Visually Impaired
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # Camera & Image Processing
  camera: ^0.10.5
  image: ^4.1.7
  flutter_vision: ^1.1.4
  
  # Network & Communication
  socket_io_client: ^2.0.3
  wifi_iot: ^0.3.19
  
  # Text to Speech
  flutter_tts: ^4.0.2
  
  # State Management
  provider: ^6.1.1
  
  # Permissions
  permission_handler: ^11.1.0
  
  # Audio
  audioplayers: ^5.2.1
  
  # UI
  google_fonts: ^6.1.0
  flutter_screenutil: ^5.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/models/
